<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IronLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#185FA5;--blue-dark:#0C447C;--blue-light:#E6F1FB;
  --amber:#EF9F27;--green:#0F6E56;--green-light:#E1F5EE;
  --red:#A32D2D;--red-light:#FCEBEB;
  --bg:#F4F4F2;--surface:#FFFFFF;--surface2:#F1EFE8;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --text:#1a1a18;--text2:#5F5E5A;--text3:#888780;
  --radius:12px;--radius-sm:8px;--pill:20px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18;--surface:#242422;--surface2:#2c2c2a;
    --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);
    --text:#f0ede8;--text2:#B4B2A9;--text3:#888780;
    --blue-light:#0c2a45;--green-light:#04342c;--red-light:#2a1010;
  }
}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
body{display:flex;justify-content:center;}
.app{width:100%;max-width:430px;min-height:100%;background:var(--bg);display:flex;flex-direction:column;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;background:var(--surface);border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:10;}
.logo{display:flex;align-items:center;gap:7px;font-size:18px;font-weight:500;letter-spacing:-.4px;}
.logo .bolt{color:var(--amber);font-size:20px;}
.logo span{color:var(--blue);}
.icon-btn{border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:6px 11px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;background:var(--surface);display:flex;align-items:center;gap:5px;font-family:inherit;transition:background .15s;}
.icon-btn:hover{background:var(--surface2);}

.tab-bar{display:flex;background:var(--surface);border-bottom:0.5px solid var(--border);}
.tab{flex:1;text-align:center;padding:11px 0;font-size:13px;font-weight:500;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:all .15s;font-family:inherit;background:none;border-left:none;border-right:none;border-top:none;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}

.day-tabs{display:flex;background:var(--surface);border-bottom:0.5px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;padding:10px 12px 8px;text-align:center;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;min-width:72px;}
.day-tab.active{border-bottom-color:var(--blue);}
.day-tab .icon{font-size:18px;display:block;margin-bottom:3px;}
.day-tab .dlabel{font-size:11px;font-weight:500;color:var(--text);}
.day-tab.active .dlabel{color:var(--blue);}
.day-tab .dsub{font-size:10px;color:var(--text3);line-height:1.3;}

.date-row{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface);border-bottom:0.5px solid var(--border);margin-bottom:10px;}
.date-row label{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px;white-space:nowrap;}
.date-row input[type=date]{border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:6px 10px;font-size:13px;background:var(--surface2);color:var(--text);flex:1;font-family:inherit;outline:none;}
.date-row input[type=date]:focus{border-color:var(--blue);}

.ex-card{background:var(--surface);border-radius:var(--radius);margin:0 10px 10px;border:0.5px solid var(--border);overflow:hidden;}
.ex-header{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 14px 8px;gap:8px;}
.ex-name{font-size:15px;font-weight:500;color:var(--blue);}
.ex-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;}
.ex-scheme{display:inline-block;font-size:11px;background:var(--surface2);color:var(--text2);border-radius:var(--pill);padding:2px 9px;font-weight:500;font-family:'DM Mono',monospace;}
.ex-rest{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--text3);padding:2px 8px;border-radius:var(--pill);background:var(--surface2);}
.warmup-block{padding:6px 14px 8px;background:var(--surface2);border-top:0.5px solid var(--border);font-size:11px;color:var(--text3);line-height:1.7;}
.warmup-block strong{color:var(--text2);font-weight:500;display:block;margin-bottom:2px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
.add-btn{border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;font-weight:500;color:var(--text2);background:var(--surface);cursor:pointer;white-space:nowrap;font-family:inherit;transition:background .15s;flex-shrink:0;}
.add-btn:hover{background:var(--surface2);}
.serie-header{display:grid;grid-template-columns:26px 1fr 1fr 30px;gap:6px;padding:4px 14px 6px;border-top:0.5px solid var(--border);}
.serie-header span{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;text-align:center;}
.serie-header span:first-child{text-align:left;}
.serie-row{display:grid;grid-template-columns:26px 1fr 1fr 30px;gap:6px;padding:5px 14px;align-items:center;}
.serie-num{font-size:13px;color:var(--text3);font-weight:500;font-family:'DM Mono',monospace;}
.field-wrap{display:flex;flex-direction:column;gap:2px;}
.serie-row input[type=number]{text-align:center;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:8px 4px;font-size:14px;font-weight:500;width:100%;background:var(--surface2);color:var(--text);font-family:'DM Mono',monospace;outline:none;-moz-appearance:textfield;}
.serie-row input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
.serie-row input[type=number]:focus{border-color:var(--blue);background:var(--surface);}
.last-hint{font-size:10px;color:var(--text3);text-align:center;font-family:'DM Mono',monospace;}
.del-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;text-align:center;padding:4px;border-radius:6px;transition:color .15s;display:flex;align-items:center;justify-content:center;}
.del-btn:hover{color:var(--red);}

/* Timer */


.save-bar{padding:12px 10px 36px;background:var(--bg);}
.save-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;}
.save-btn:hover{background:var(--blue-dark);}

.toast{margin:0 10px 8px;padding:9px 16px;background:var(--green-light);border:0.5px solid var(--green);border-radius:var(--radius-sm);font-size:13px;color:var(--green);text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

.hist-wrap{padding:10px;}
.hist-filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.hist-filters select{flex:1;min-width:130px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:7px 10px;font-size:13px;background:var(--surface);color:var(--text);font-family:inherit;outline:none;}
.hist-session{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.hist-session-hd{padding:10px 14px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.hist-date{font-size:13px;font-weight:500;}
.hist-day-label{font-size:11px;color:var(--blue);font-weight:500;}
.hist-ex{padding:10px 14px;border-bottom:0.5px solid var(--border);}
.hist-ex:last-child{border-bottom:none;}
.hist-ex-name{font-size:13px;font-weight:500;margin-bottom:5px;}
.hist-set-line{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--text2);margin-bottom:2px;}
.hist-set-num{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;min-width:14px;}
.hist-lb{font-weight:500;color:var(--text);font-family:'DM Mono',monospace;}
.hist-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:3px 5px;border-radius:4px;transition:color .15s;margin-left:auto;display:flex;align-items:center;}
.hist-del:hover{color:var(--red);}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:13px;}
.empty i{font-size:32px;display:block;margin-bottom:10px;}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:430px;padding-bottom:env(safe-area-inset-bottom,16px);}
.sheet-hd{padding:14px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sheet-title{font-size:15px;font-weight:500;}
.sheet-close{background:none;border:none;cursor:pointer;color:var(--text2);font-size:20px;padding:2px;display:flex;align-items:center;}
.sheet-body{padding:14px 14px 6px;}
.sheet-body p{font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.6;}
.sheet-actions{display:flex;flex-direction:column;gap:8px;padding:0 14px 16px;}
.sheet-btn{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;width:100%;text-align:left;}
.sheet-btn:hover{background:var(--blue-light);}
.sheet-btn i{font-size:18px;color:var(--blue);flex-shrink:0;}
.sheet-btn-sub{font-size:11px;color:var(--text3);font-weight:400;margin-top:1px;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="logo"><i class="ti ti-bolt bolt" aria-hidden="true"></i>IRON<span>LOG</span></div>
    <button class="icon-btn" onclick="openSheet()" aria-label="Données"><i class="ti ti-database" aria-hidden="true" style="font-size:15px"></i> Données</button>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="setTab(0,this)">Séance</button>
    <button class="tab" onclick="setTab(1,this)">Historique</button>
  </div>

  <div id="view-seance">
    <div class="day-tabs" id="day-tabs"></div>
    <div class="date-row">
      <label><i class="ti ti-calendar" aria-hidden="true" style="font-size:16px"></i> Date</label>
      <input type="date" id="session-date">
    </div>
    <div id="exercises-list"></div>
    <div class="toast" id="toast"></div>
    <div class="save-bar">
      <button class="save-btn" onclick="saveSession()"><i class="ti ti-device-floppy" aria-hidden="true" style="font-size:17px"></i>Sauvegarder la séance</button>
    </div>
  </div>

  <div id="view-history" style="display:none">
    <div class="hist-wrap">
      <div class="hist-filters">
        <select id="hf-day" onchange="renderHistory()">
          <option value="">Tous les jours</option>
          <option value="0">Jour 1 – Push</option>
          <option value="1">Jour 2 – Jambes A</option>
          <option value="2">Jour 3 – Pull</option>
          <option value="3">Jour 4 – Upper</option>
          <option value="4">Jour 5 – Jambes B</option>
        </select>
        <select id="hf-ex" onchange="renderHistory()">
          <option value="">Tous les exercices</option>
        </select>
      </div>
      <div id="hist-content"></div>
    </div>
  </div>

</div>

<div class="overlay" id="overlay" onclick="closeSheetOutside(event)">
  <div class="sheet">
    <div class="sheet-hd">
      <span class="sheet-title">Gérer les données</span>
      <button class="sheet-close" onclick="closeSheet()"><i class="ti ti-x"></i></button>
    </div>
    <div class="sheet-body">
      <p>Exporte tes données pour les sauvegarder ou les transférer sur un autre appareil.</p>
    </div>
    <div class="sheet-actions">
      <button class="sheet-btn" onclick="exportJSON()">
        <i class="ti ti-download" aria-hidden="true"></i>
        <div><div>Exporter JSON</div><div class="sheet-btn-sub">Sauvegarde complète — pour réimporter plus tard</div></div>
      </button>
      <button class="sheet-btn" onclick="document.getElementById('import-file').click()">
        <i class="ti ti-upload" aria-hidden="true"></i>
        <div><div>Importer JSON</div><div class="sheet-btn-sub">Restaurer depuis un fichier exporté</div></div>
      </button>
      <button class="sheet-btn" onclick="exportCSV()">
        <i class="ti ti-file-spreadsheet" aria-hidden="true"></i>
        <div><div>Exporter CSV</div><div class="sheet-btn-sub">Compatible Excel et Google Sheets</div></div>
      </button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importJSON(event)">
    </div>
  </div>
</div>

<script>
const DAYS=[
  {
    label:'Jour 1',sub:'Push',icon:'🫸',
    exercises:[
      {n:'Développé incliné haltères',s:'3×8-12',rest:'2 min',
       warmup:'2 séries légères : 20 lb × 10–12, puis 25 lb × 10–12',
       defaultLb:30},
      {n:'Chest press',s:'3×8-12',rest:'2 min',
       warmup:'30 lb × 10',
       defaultLb:50},
      {n:'Fly machine',s:'2×10-15',rest:'1,5 min',
       warmup:null,
       defaultLb:50},
      {n:'Élévations latérales',s:'3×12-15',rest:'1 min',
       warmup:null,
       defaultLb:15},
      {n:'Extension triceps',s:'3×10-15',rest:'1,5 min',
       warmup:null,
       defaultLb:22.5},
    ]
  },
  {
    label:'Jour 2',sub:'Jambes A',icon:'🦵',
    exercises:[
      {n:'Leg press',s:'4×6-10',rest:'2 min',
       warmup:'1–3 séries progressives : 100 lb × 10, 140 lb × 10',
       defaultLb:160},
      {n:'Leg extension',s:'2×10-15',rest:'1,5 min',
       warmup:null,
       defaultLb:40},
      {n:'Leg curl',s:'3×8-12',rest:'1,5 min',
       warmup:null,
       defaultLb:50},
      {n:'Mollets machine',s:'4×10-15',rest:'1 min',
       warmup:null,
       defaultLb:80},
      {n:'Abdos',s:'3×10-15',rest:'1 min',
       warmup:null,
       defaultLb:null},
    ]
  },
  {
    label:'Jour 3',sub:'Pull',icon:'🫷',
    exercises:[
      {n:'Tirage horizontal neutre',s:'3×8-12',rest:'2 min',
       warmup:'55 lb × 10–12, puis 70 lb × 5–8',
       defaultLb:85},
      {n:'Tirage vertical neutre',s:'3×8-12',rest:'2 min',
       warmup:'40 lb × 10–12',
       defaultLb:70},
      {n:'T-barre',s:'2×8-12',rest:'2 min',
       warmup:'25 lb × 10–12, puis 35 lb × 5–8',
       defaultLb:45},
      {n:'Reverse fly machine',s:'3×10-15',rest:'1 min',
       warmup:null,
       defaultLb:40},
      {n:'Curl biceps',s:'3×8-12',rest:'1,5 min',
       warmup:null,
       defaultLb:20},
      {n:'Curl marteau',s:'2×10-12',rest:'1,5 min',
       warmup:null,
       defaultLb:null},
    ]
  },
  {
    label:'Jour 4',sub:'Upper',icon:'💪',
    exercises:[
      {n:'Chest press',s:'2×8-12',rest:'2 min',
       warmup:'30 lb × 10',
       defaultLb:50},
      {n:'Fly machine',s:'2×10-15',rest:'1,5 min',
       warmup:null,
       defaultLb:50},
      {n:'Tirage horizontal neutre',s:'2×8-12',rest:'2 min',
       warmup:'55 lb × 10',
       defaultLb:85},
      {n:'Tirage vertical neutre',s:'2×8-12',rest:'2 min',
       warmup:'40 lb × 10',
       defaultLb:70},
      {n:'Élévations latérales',s:'2×12-15',rest:'1 min',
       warmup:null,
       defaultLb:15},
      {n:'Reverse fly machine',s:'2×12-15',rest:'1 min',
       warmup:null,
       defaultLb:40},
      {n:'Curl biceps',s:'2×10-12',rest:'1,5 min',
       warmup:null,
       defaultLb:20},
      {n:'Extension triceps',s:'2×10-15',rest:'1,5 min',
       warmup:null,
       defaultLb:22.5},
    ]
  },
  {
    label:'Jour 5',sub:'Jambes B',icon:'🔥',
    exercises:[
      {n:'Back squat',s:'4×6-10',rest:'2 min',
       warmup:'2–3 séries progressives : barre vide, puis 10 lb',
       defaultLb:25},
      {n:'Hip thrust barre',s:'3×8-12',rest:'2 min',
       warmup:'1–2 séries si nécessaire',
       defaultLb:null},
      {n:'RDL barre',s:'3×8-12',rest:'2 min',
       warmup:'1–2 séries progressives',
       defaultLb:null},
      {n:'Mollets debout',s:'4×10-15',rest:'1 min',
       warmup:null,
       defaultLb:null},
      {n:'Abdos',s:'3×10-15',rest:'1 min',
       warmup:null,
       defaultLb:null},
    ]
  },
];

let curDay=0,state={};
let sessions=[];
try{sessions=JSON.parse(localStorage.getItem('il_v2')||'[]')}catch{}
function save(){try{localStorage.setItem('il_v2',JSON.stringify(sessions))}catch{}}
function today(){return new Date().toISOString().split('T')[0]}
function fmtDate(s){
  if(!s)return '';
  const[y,m,d]=s.split('-');
  const mo=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  return d+' '+mo[parseInt(m)-1]+' '+y;
}

document.getElementById('session-date').value=today();
buildState(0);renderDayTabs();renderExercises();renderHistFilter();

function buildState(day){
  state={};
  DAYS[day].exercises.forEach(ex=>{
    const lb=ex.defaultLb!=null?ex.defaultLb:'';
    state[ex.n]=[{lb:String(lb),reps:''}];
  });
}

function renderDayTabs(){
  const wrap=document.getElementById('day-tabs');
  wrap.innerHTML='';
  DAYS.forEach((d,i)=>{
    const div=document.createElement('div');
    div.className='day-tab'+(i===curDay?' active':'');
    div.innerHTML=`<span class="icon">${d.icon}</span><div class="dlabel">${d.label}</div><div class="dsub">${d.sub}</div>`;
    div.onclick=()=>{curDay=i;buildState(i);renderDayTabs();renderExercises();};
    wrap.appendChild(div);
  });
}

function getLastSets(exName){
  for(let i=sessions.length-1;i>=0;i--){
    if(sessions[i].day===curDay){
      const ex=sessions[i].exercises.find(e=>e.name===exName);
      if(ex&&ex.sets.length) return ex.sets;
    }
  }
  return null;
}


function renderExercises(){
  const wrap=document.getElementById('exercises-list');
  wrap.innerHTML='';
  DAYS[curDay].exercises.forEach(ex=>{
    const sets=state[ex.n];
    const last=getLastSets(ex.n);
    const cardId='card-'+btoa(encodeURIComponent(ex.n)).replace(/[^a-zA-Z0-9]/g,'');
    const card=document.createElement('div');
    card.className='ex-card';
    card.id=cardId;

    const warmupHtml=ex.warmup
      ?`<div class="warmup-block"><strong>Échauffement</strong>${ex.warmup}</div>`:'';

    const setsHtml=sets.map((s,si)=>{
      const lLb=last&&last[si]?last[si].lb:'';
      const lReps=last&&last[si]?last[si].reps:'';
      const hint=lLb?`<div class="last-hint">${lLb} lb × ${lReps||'?'}</div>`:'<div class="last-hint"> </div>';
      const enc=encodeURIComponent(ex.n);
      return `<div class="serie-row">
        <span class="serie-num">${si+1}</span>
        <div class="field-wrap">
          <input type="number" inputmode="decimal" placeholder="—" min="0" step="2.5" value="${s.lb}" data-ex="${enc}" data-si="${si}" data-field="lb" onchange="setState(this)">
          ${hint}
        </div>
        <input type="number" inputmode="numeric" placeholder="—" min="0" step="1" value="${s.reps}" data-ex="${enc}" data-si="${si}" data-field="reps" onchange="setState(this)">
        <button class="del-btn" onclick="delSet('${enc}',${si})" aria-label="Supprimer"><i class="ti ti-x" aria-hidden="true" style="font-size:14px"></i></button>
      </div>`;
    }).join('');

    card.innerHTML=`
      <div class="ex-header">
        <div>
          <div class="ex-name">${ex.n}</div>
          <div class="ex-meta">
            <span class="ex-scheme">${ex.s}</span>
            ${ex.rest?`<span class="ex-rest"><i class="ti ti-clock" aria-hidden="true" style="font-size:11px"></i> ${ex.rest}</span>`:''}
          </div>
        </div>
        <button class="add-btn" onclick="addSet('${encodeURIComponent(ex.n)}')">+ série</button>
      </div>
      ${warmupHtml}
      <div class="serie-header"><span>#</span><span>LB</span><span>REPS</span><span></span></div>
      ${setsHtml}`;
    wrap.appendChild(card);
  });
}

function setState(input){
  const exName=decodeURIComponent(input.dataset.ex);
  const si=parseInt(input.dataset.si);
  if(state[exName]) state[exName][si][input.dataset.field]=input.value;
}
function addSet(enc){
  const n=decodeURIComponent(enc);
  if(state[n]){
    const last=state[n][state[n].length-1];
    state[n].push({lb:last?last.lb:'',reps:''});
    renderExercises();
  }
}
function delSet(enc,si){
  const n=decodeURIComponent(enc);
  if(state[n]&&state[n].length>1){state[n].splice(si,1);renderExercises();}
}


function saveSession(){
  const date=document.getElementById('session-date').value;
  const exercises=DAYS[curDay].exercises.map(ex=>({
    name:ex.n,
    sets:state[ex.n].filter(s=>s.lb!==''||s.reps!=='').map(s=>({lb:parseFloat(s.lb)||0,reps:parseInt(s.reps)||0}))
  })).filter(e=>e.sets.length>0);
  if(!exercises.length){showToast('Aucune donnée saisie','warn');return;}
  sessions.push({date,day:curDay,dayLabel:DAYS[curDay].label+' – '+DAYS[curDay].sub,ts:Date.now(),exercises});
  save();showToast('Séance sauvegardée !');
  buildState(curDay);renderExercises();renderHistFilter();
}

function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=type==='warn'?'var(--red-light)':'var(--green-light)';
  t.style.borderColor=type==='warn'?'var(--red)':'var(--green)';
  t.style.color=type==='warn'?'var(--red)':'var(--green)';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);
}

function setTab(idx,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('view-seance').style.display=idx===0?'':'none';
  document.getElementById('view-history').style.display=idx===1?'':'none';
  if(idx===1){renderHistory();renderHistFilter();}
}

function renderHistFilter(){
  const sel=document.getElementById('hf-ex');
  const prev=sel.value;
  sel.innerHTML='<option value="">Tous les exercices</option>';
  [...new Set(sessions.flatMap(s=>s.exercises.map(e=>e.name)))].forEach(n=>{
    const o=document.createElement('option');o.value=n;o.textContent=n;if(n===prev)o.selected=true;sel.appendChild(o);
  });
}

function renderHistory(){
  const dayF=document.getElementById('hf-day').value;
  const exF=document.getElementById('hf-ex').value;
  let rows=[...sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  if(dayF!=='') rows=rows.filter(r=>r.day==dayF);
  if(exF!=='') rows=rows.filter(r=>r.exercises.some(e=>e.name===exF));
  const wrap=document.getElementById('hist-content');
  if(!rows.length){
    wrap.innerHTML='<div class="empty"><i class="ti ti-clipboard-list" aria-hidden="true"></i>Aucune séance enregistrée</div>';
    return;
  }
  wrap.innerHTML=rows.map(sess=>{
    const origIdx=sessions.indexOf(sess);
    const exList=exF?sess.exercises.filter(e=>e.name===exF):sess.exercises;
    const exHtml=exList.map(ex=>`<div class="hist-ex">
      <div class="hist-ex-name">${ex.name}</div>
      ${ex.sets.map((s,i)=>`<div class="hist-set-line">
        <span class="hist-set-num">${i+1}</span>
        <span class="hist-lb">${s.lb} lb</span>
        <span>× ${s.reps} reps</span>
      </div>`).join('')}
    </div>`).join('');
    return `<div class="hist-session">
      <div class="hist-session-hd">
        <span class="hist-date">${fmtDate(sess.date)}</span>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="hist-day-label">${sess.dayLabel||''}</span>
          <button class="hist-del" onclick="deleteSession(${origIdx})" aria-label="Supprimer"><i class="ti ti-trash" aria-hidden="true"></i></button>
        </div>
      </div>
      ${exHtml}
    </div>`;
  }).join('');
}

function deleteSession(idx){
  if(!confirm('Supprimer cette séance ?')) return;
  sessions.splice(idx,1);save();renderHistory();renderHistFilter();
}

function openSheet(){document.getElementById('overlay').classList.add('open');}
function closeSheet(){document.getElementById('overlay').classList.remove('open');}
function closeSheetOutside(e){if(e.target===document.getElementById('overlay'))closeSheet();}

function exportJSON(){
  const blob=new Blob([JSON.stringify(sessions,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='ironlog-backup.json';a.click();
  URL.revokeObjectURL(url);closeSheet();
}
function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const imported=JSON.parse(ev.target.result);
      if(!Array.isArray(imported))throw new Error();
      if(!confirm(`Importer ${imported.length} séance(s) ? Elles seront fusionnées avec tes données existantes.`))return;
      const existing=new Set(sessions.map(s=>s.ts));
      const newOnes=imported.filter(s=>!existing.has(s.ts));
      sessions=[...sessions,...newOnes].sort((a,b)=>a.date.localeCompare(b.date));
      save();renderHistory();renderHistFilter();closeSheet();
      showToast(`${newOnes.length} séance(s) importée(s) !`);
    }catch{showToast('Fichier invalide','warn');}
  };
  reader.readAsText(file);e.target.value='';
}
function exportCSV(){
  if(!sessions.length){showToast('Aucune donnée','warn');return;}
  let csv='Date,Jour,Exercice,Série,LB,Reps\n';
  sessions.forEach(s=>s.exercises.forEach(ex=>ex.sets.forEach((set,i)=>{
    csv+=`${s.date},"${s.dayLabel||''}","${ex.name}",${i+1},${set.lb},${set.reps}\n`;
  })));
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='ironlog.csv';a.click();
  URL.revokeObjectURL(url);closeSheet();
}
</script>
