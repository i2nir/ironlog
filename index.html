<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<title>IronLog — Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#185FA5;--blue-dark:#0C447C;--blue-light:#E6F1FB;
  --amber:#EF9F27;--amber-light:#FAEEDA;
  --green:#0F6E56;--green-light:#E1F5EE;
  --red:#A32D2D;--red-light:#FCEBEB;
  --bg:#F4F4F2;--surface:#FFFFFF;--surface2:#F1EFE8;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --text:#1a1a18;--text2:#5F5E5A;--text3:#888780;
  --radius:12px;--radius-sm:8px;--pill:20px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18;--surface:#242422;--surface2:#2c2c2a;
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);
  --text:#f0ede8;--text2:#B4B2A9;--text3:#888780;
  --blue-light:#0c2a45;--amber-light:#2a1f05;--green-light:#04342c;--red-light:#2a1010;
}}
html,body{min-height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:pan-y pinch-zoom;}
body{display:flex;justify-content:center;}
.app{width:100%;max-width:520px;min-height:100%;background:var(--bg);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 14px;background:var(--surface);border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:20;}
.logo{display:flex;align-items:center;gap:7px;font-size:22px;font-weight:500;letter-spacing:-.4px;}
.logo .bolt{color:var(--amber);font-size:24px;}
.logo span{color:var(--blue);}
.icon-btn{border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:9px 14px;font-size:15px;font-weight:500;color:var(--text2);cursor:pointer;background:var(--surface);display:flex;align-items:center;gap:6px;font-family:inherit;transition:background .15s;}
.icon-btn:hover{background:var(--surface2);}

/* Tabs */
.tab-bar{display:flex;background:var(--surface);border-bottom:0.5px solid var(--border);}
.tab{flex:1;text-align:center;padding:13px 0;font-size:15px;font-weight:500;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:all .15s;font-family:inherit;background:none;border-left:none;border-right:none;border-top:none;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}

/* Day tabs */
.day-tabs{display:flex;background:var(--surface);border-bottom:0.5px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;padding:11px 13px 9px;text-align:center;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;min-width:78px;}
.day-tab.active{border-bottom-color:var(--blue);}
.day-tab .icon{font-size:20px;display:block;margin-bottom:3px;}
.day-tab .dlabel{font-size:13px;font-weight:500;color:var(--text);}
.day-tab.active .dlabel{color:var(--blue);}
.day-tab .dsub{font-size:11px;color:var(--text3);line-height:1.3;}

/* Date row */
.date-row{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:0.5px solid var(--border);margin-bottom:12px;}
.date-row label{font-size:15px;color:var(--text2);display:flex;align-items:center;gap:6px;white-space:nowrap;}
.date-row input[type=date]{border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:8px 12px;font-size:15px;background:var(--surface2);color:var(--text);flex:1;font-family:inherit;outline:none;}

/* Exercise card */
.ex-card{background:var(--surface);border-radius:var(--radius);margin:0 12px 12px;border:0.5px solid var(--border);overflow:hidden;}
.ex-header{display:flex;align-items:flex-start;justify-content:space-between;padding:13px 16px 9px;gap:8px;}
.ex-name{font-size:17px;font-weight:500;color:var(--blue);}
.ex-meta{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap;}
.ex-scheme{font-size:13px;background:var(--surface2);color:var(--text2);border-radius:var(--pill);padding:3px 11px;font-weight:500;font-family:'DM Mono',monospace;}
.ex-rest{font-size:13px;color:var(--text3);padding:3px 10px;border-radius:var(--pill);background:var(--surface2);display:flex;align-items:center;gap:3px;}
.add-inline{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--blue);border-radius:50%;background:var(--blue-light);color:var(--blue);font-size:20px;font-weight:500;cursor:pointer;line-height:1;flex-shrink:0;}
.done-btn{width:48px;min-height:40px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text2);font:500 12px 'DM Sans',sans-serif;cursor:pointer;padding:3px;}
.done-btn.is-done{background:var(--green-light);border-color:var(--green);color:var(--green);}

/* Serie rows */
.serie-header{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 44px 24px;gap:5px;padding:5px 14px 6px;border-top:0.5px solid var(--border);}
.serie-header span{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;text-align:center;}
.serie-header span:first-child{text-align:left;}
.serie-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 44px 24px;gap:5px;padding:5px 14px;align-items:center;}
.serie-row.warmup-row{background:var(--amber-light);}
.serie-num{font-size:15px;color:var(--text3);font-weight:500;font-family:'DM Mono',monospace;}
.serie-num.wu-num{color:#854F0B;}
.serie-row input[type=number]{min-height:42px;text-align:center;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:10px 4px;font-size:17px;font-weight:500;width:100%;background:var(--surface2);color:var(--text);font-family:'DM Mono',monospace;outline:none;-moz-appearance:textfield;}
.serie-row.warmup-row input[type=number]{background:rgba(239,159,39,0.12);border-color:rgba(186,117,23,0.3);color:#633806;}
@media(prefers-color-scheme:dark){.serie-row.warmup-row input[type=number]{color:#FAC775;}}
.serie-row input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
.serie-row input[type=number]:focus{border-color:var(--blue);background:var(--surface);}

/* Indicator */
.ind-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--radius-sm);border:none;font-size:18px;cursor:pointer;background:none;transition:transform .1s;}
.ind-btn:active{transform:scale(.88);}

/* Recommendation */
.reco-block{margin:6px 14px 2px;border-radius:var(--radius-sm);padding:9px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.reco-block.reco-up{background:var(--green-light);border:0.5px solid var(--green);}
.reco-block.reco-hold{background:var(--surface2);border:0.5px solid var(--border2);}
.reco-block.reco-down{background:var(--red-light);border:0.5px solid var(--red);}
.reco-text{font-size:14px;font-weight:500;}
.reco-block.reco-up .reco-text{color:var(--green);}
.reco-block.reco-hold .reco-text{color:var(--text2);}
.reco-block.reco-down .reco-text{color:var(--red);}
.reco-next{font-size:12px;color:var(--text3);}


/* Autosave, shoulder tracking and training statistics */
.shoulder-panel{margin:0 12px 12px;padding:12px 14px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);}
.shoulder-panel label{display:block;font-size:14px;font-weight:500;color:var(--text2);margin-bottom:8px;}
.shoulder-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.shoulder-row input{flex:1;min-width:0;accent-color:var(--blue);min-height:28px;}
.shoulder-row output{min-width:44px;text-align:right;font:500 16px 'DM Mono',monospace;color:var(--blue);}
#shoulder-note{width:100%;min-height:42px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:10px 11px;font:14px 'DM Sans',sans-serif;background:var(--surface2);color:var(--text);}
.autosave-status{font-size:11px;color:var(--text3);margin-top:7px;}
.stats-panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px;}
.stats-tile{padding:12px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-sm);min-width:0;}
.stats-value{font:500 21px 'DM Mono',monospace;color:var(--blue);}
.stats-label{font-size:12px;color:var(--text2);margin-top:3px;}
.stats-note{grid-column:1/-1;padding:11px 12px;background:var(--surface2);border-radius:var(--radius-sm);font-size:13px;color:var(--text2);line-height:1.45;}
@media(max-width:360px){.serie-header,.serie-row{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 46px 20px;gap:4px;padding-left:8px;padding-right:8px}.done-btn{width:46px;font-size:11px}.ex-card{margin-left:8px;margin-right:8px}.ex-header{padding-left:11px;padding-right:11px}}
button,input,select{touch-action:manipulation;}

/* Rest timer removed */

/* Del btn */
.del-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:4px;border-radius:6px;transition:color .15s;display:flex;align-items:center;justify-content:center;}
.del-btn:hover{color:var(--red);}

/* Comment */
.comment-row{padding:5px 14px 8px;}
.comment-row input[type=text]{width:100%;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;font-size:15px;background:var(--surface2);color:var(--text);font-family:inherit;outline:none;}
.comment-row input[type=text]:focus{border-color:var(--blue);}
.comment-row input[type=text]::placeholder{color:var(--text3);}

/* Card footer */
.card-footer{display:flex;gap:8px;padding:8px 14px 12px;border-top:0.5px solid var(--border);}
.footer-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:9px 10px;font-size:14px;font-weight:500;color:var(--text2);background:var(--surface);cursor:pointer;font-family:inherit;transition:background .15s;}
.footer-btn:hover{background:var(--surface2);}

/* Labels */
.wu-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#854F0B;padding:4px 14px 2px;background:var(--amber-light);border-top:0.5px solid rgba(186,117,23,0.2);}
.work-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:4px 14px 2px;border-top:0.5px solid var(--border);}

/* Save */
.save-bar{padding:14px 12px 40px;display:flex;flex-direction:column;gap:10px;}
.save-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-size:17px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;}
.save-btn:hover{background:var(--blue-dark);}
.record-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:var(--surface);color:var(--text2);border:0.5px solid var(--border2);border-radius:var(--radius);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;}
.record-btn:hover{background:var(--surface2);}

.toast{margin:0 12px 10px;padding:11px 16px;background:var(--green-light);border:0.5px solid var(--green);border-radius:var(--radius-sm);font-size:15px;color:var(--green);text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

/* History */
.hist-wrap{padding:12px;}
.hist-filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.hist-filters select{flex:1;min-width:130px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:10px 12px;font-size:15px;background:var(--surface);color:var(--text);font-family:inherit;outline:none;}
.hist-session{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.hist-session-hd{padding:12px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.hist-date{font-size:15px;font-weight:500;}
.hist-day-label{font-size:11px;color:var(--blue);font-weight:500;}
.hist-ex{padding:10px 16px;border-bottom:0.5px solid var(--border);}
.hist-ex:last-child{border-bottom:none;}
.hist-ex-name{font-size:14px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;}
.hist-ex-chart-btn{font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;padding:2px 0;}
.hist-set-line{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--text2);margin-bottom:2px;}
.hist-set-num{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;min-width:16px;}
.hist-lb{font-weight:500;color:var(--text);font-family:'DM Mono',monospace;}
.hist-wu-tag{font-size:11px;background:var(--amber-light);color:#854F0B;border-radius:var(--pill);padding:1px 7px;font-weight:500;}
.hist-comment{font-size:13px;color:var(--text3);margin-top:5px;font-style:italic;}
.hist-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:19px;padding:4px 6px;border-radius:4px;margin-left:auto;display:flex;align-items:center;}
.hist-del:hover{color:var(--red);}
.hist-summary{padding:10px 16px;background:var(--surface2);display:flex;gap:14px;flex-wrap:wrap;}
.hist-stat{font-size:13px;color:var(--text2);}
.hist-stat strong{color:var(--text);font-weight:500;}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:15px;}
.empty i{font-size:36px;display:block;margin-bottom:10px;}

/* Journal */
.journal-wrap{padding:12px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-month{font-size:17px;font-weight:500;}
.cal-nav{background:none;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:7px 12px;font-size:18px;cursor:pointer;color:var(--text2);display:flex;align-items:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px;}
.cal-day-name{text-align:center;font-size:11px;font-weight:500;color:var(--text3);padding:4px 0;text-transform:uppercase;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:14px;font-weight:500;cursor:default;position:relative;}
.cal-cell.has-session{background:var(--blue);color:#fff;cursor:pointer;}
.cal-cell.has-session:hover{background:var(--blue-dark);}
.cal-cell.today{box-shadow:0 0 0 2px var(--blue);}
.cal-cell.other-month{color:var(--text3);opacity:.4;}
.session-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.session-card-hd{padding:11px 14px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.session-card-date{font-size:14px;font-weight:500;}
.session-card-day{font-size:12px;color:var(--blue);font-weight:500;}
.session-card-stats{padding:9px 14px;font-size:13px;color:var(--text2);display:flex;gap:14px;background:var(--surface2);}
.session-card-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:17px;display:flex;align-items:center;}

/* Chart modal */
.chart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:flex-end;justify-content:center;}
.chart-overlay.open{display:flex;}
.chart-sheet{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:520px;padding-bottom:env(safe-area-inset-bottom,16px);}
.chart-hd{padding:14px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.chart-title{font-size:16px;font-weight:500;}
.chart-close{background:none;border:none;cursor:pointer;color:var(--text2);font-size:22px;display:flex;align-items:center;}
.chart-body{padding:16px;}
.chart-canvas-wrap{position:relative;height:200px;margin-bottom:12px;}
.chart-stats{display:flex;gap:10px;justify-content:space-around;}
.chart-stat{text-align:center;}
.chart-stat-val{font-size:20px;font-weight:500;font-family:'DM Mono',monospace;}
.chart-stat-label{font-size:12px;color:var(--text3);}

/* Data sheet */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.sheet{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:520px;padding-bottom:env(safe-area-inset-bottom,16px);}
.sheet-hd{padding:16px 18px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sheet-title{font-size:17px;font-weight:500;}
.sheet-close{background:none;border:none;cursor:pointer;color:var(--text2);font-size:22px;padding:2px;display:flex;align-items:center;}
.sheet-body{padding:16px 16px 8px;}
.sheet-body p{font-size:15px;color:var(--text2);margin-bottom:14px;line-height:1.6;}
.sheet-actions{display:flex;flex-direction:column;gap:10px;padding:0 16px 20px;}
.sheet-btn{display:flex;align-items:center;gap:14px;padding:15px 16px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;width:100%;text-align:left;}
.sheet-btn:hover{background:var(--blue-light);}
.sheet-btn i{font-size:22px;color:var(--blue);flex-shrink:0;}
.sheet-btn-sub{font-size:13px;color:var(--text3);font-weight:400;margin-top:2px;}
</style>
</head>
<body>
<div class="app">

<div class="topbar">
  <div class="logo"><i class="ti ti-bolt bolt"></i>IRON<span>LOG</span></div>
  <button class="icon-btn" onclick="openSheet()"><i class="ti ti-database" style="font-size:16px"></i> Données</button>
</div>

<div class="tab-bar">
  <button class="tab active" onclick="setTab(0,this)">Séance</button>
  <button class="tab" onclick="setTab(1,this)">Historique</button>
  <button class="tab" onclick="setTab(2,this)">Journal</button>
</div>

<!-- SÉANCE -->
<div id="view-seance">
  <div class="day-tabs" id="day-tabs"></div>
  <div class="date-row">
    <label><i class="ti ti-calendar" style="font-size:16px"></i> Date</label>
    <input type="date" id="session-date">
  </div>
  <div class="shoulder-panel">
    <label for="shoulder-pain">Épaule — douleur (0 à 10)</label>
    <div class="shoulder-row"><input type="range" id="shoulder-pain" min="0" max="10" step="1" value="0"><output id="shoulder-value">0/10</output></div>
    <input type="text" id="shoulder-note" maxlength="240" placeholder="Épaule : mouvement déclencheur, claquement, évolution…">
    <div class="autosave-status" id="autosave-status" role="status" aria-live="polite">Sauvegarde automatique activée</div>
  </div>
  <div id="exercises-list"></div>
  <div class="toast" id="toast"></div>
  <div class="save-bar">
    <button class="record-btn" onclick="recordSession()"><i class="ti ti-bookmark" style="font-size:17px"></i>Enregistrer en cours</button>
    <button class="save-btn" onclick="saveSession()"><i class="ti ti-device-floppy" style="font-size:18px"></i>Sauvegarder la séance</button>
  </div>
</div>

<!-- HISTORIQUE -->
<div id="view-history" style="display:none">
  <div class="hist-wrap">
    <div class="hist-filters">
      <select id="hf-day" onchange="renderHistory()">
        <option value="">Tous les jours</option>
        <option value="0">Jour 1 – Push</option>
        <option value="1">Jour 2 – Jambes A</option>
        <option value="2">Jour 3 – Pull</option>
        <option value="3">Jour 4 – Upper</option>
        <option value="4">Jour 5 – Jambes B</option>
      </select>
      <select id="hf-ex" onchange="renderHistory()"><option value="">Tous les exercices</option></select>
    </div>
    <div id="hist-content"></div>
  </div>
</div>

<!-- JOURNAL -->
<div id="view-journal" style="display:none">
  <div class="journal-wrap">
    <div id="stats-panel" class="stats-panel"></div>
    <div class="cal-header">
      <button class="cal-nav" onclick="calPrev()"><i class="ti ti-chevron-left"></i></button>
      <span class="cal-month" id="cal-month-label"></span>
      <button class="cal-nav" onclick="calNext()"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div id="journal-sessions"></div>

<script>
// ─── DATA ───────────────────────────────────────────────

    {n:'T-Bar Row',s:'3×8-12',rest:120,warmupSets:[{lb:25,reps:12}],defaultLb:45},

  {label:'Jour 4',sub:'Upper',icon:'💪',exercises:[

    {n:'Neutral-Grip Seated Cable Row',s:'2×8-12',rest:120,warmupSets:[{lb:55,reps:12},{lb:70,reps:8}],defaultLb:85,workCount:2},
    {n:'Machine Fly',s:'3×10-15',rest:90,warmupSets:[],defaultLb:50,workCount:3},
    {n:'Neutral-Grip Lat Pulldown',s:'2×10-12',rest:90,warmupSets:[{lb:40,reps:12}],defaultLb:70,workCount:2},
    {n:'Lateral Raises',s:'3×12-15',rest:60,warmupSets:[],defaultLb:15},
    {n:'Biceps Curl',s:'2×10-12',rest:90,warmupSets:[],defaultLb:20,workCount:2},
    {n:'Triceps Extension',s:'2×10-15',rest:90,warmupSets:[],defaultLb:30,dropdown:true,workCount:2},
  ]},
  {label:'Jour 5',sub:'Jambes B',icon:'🔥',exercises:[
    {n:'Back Squat',s:'3×6-10',rest:120,warmupSets:[{lb:0,reps:10},{lb:10,reps:10}],defaultLb:25,workCount:3},
    {n:'Barbell Hip Thrust',s:'3×8-12',rest:120,warmupSets:[{lb:0,reps:10}],defaultLb:30},
    {n:'Barbell Romanian Deadlift',s:'3×8-12',rest:120,warmupSets:[{lb:20,reps:10}],defaultLb:30},
    {n:'Standing Calf Raise',s:'4×10-15',rest:60,warmupSets:[],defaultLb:30},
    {n:'Swiss Ball Crunch',s:'3×10-15',rest:60,warmupSets:[],defaultLb:null},
  ]},
];

let curDay=0, state={}, sessions=[];
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth();
let chartInstance=null;

try{sessions=JSON.parse(localStorage.getItem('il_v2')||'[]');if(!Array.isArray(sessions))sessions=[]}catch{sessions=[]}
let autoDrafts={};
try{autoDrafts=JSON.parse(localStorage.getItem('il_autosave_v1')||'{}');if(!autoDrafts||typeof autoDrafts!=='object')autoDrafts={}}catch{autoDrafts={}}
let shoulderPain=0, shoulderNote='';
function save(){try{localStorage.setItem('il_v2',JSON.stringify(sessions));return true}catch(e){setAutosaveStatus('Stockage saturé — exporte une sauvegarde JSON.');return false}}
function draftKey(day,date){return `${date||today()}_${day}`}
function setAutosaveStatus(msg){const el=document.getElementById('autosave-status');if(el)el.textContent=msg}
function persistDraft(){
  const date=document.getElementById('session-date')?.value||today();
  autoDrafts[draftKey(curDay,date)]={day:curDay,date,state:JSON.parse(JSON.stringify(state)),shoulderPain:Number(shoulderPain)||0,shoulderNote:shoulderNote||'',updatedAt:Date.now()};
  try{localStorage.setItem('il_autosave_v1',JSON.stringify(autoDrafts));setAutosaveStatus('Sauvegardé automatiquement à '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));return true}
  catch(e){setAutosaveStatus('Impossible de sauvegarder automatiquement — exporte une sauvegarde JSON.');return false}
}
function restoreDraft(day,date){
  const d=autoDrafts[draftKey(day,date)];if(!d||!d.state)return false;
  state=d.state;shoulderPain=Number(d.shoulderPain)||0;shoulderNote=d.shoulderNote||'';
  const pain=document.getElementById('shoulder-pain'),note=document.getElementById('shoulder-note'),out=document.getElementById('shoulder-value');
  if(pain)pain.value=shoulderPain;if(note)note.value=shoulderNote;if(out)out.textContent=shoulderPain+'/10';return true;
}
function clearDraft(day,date){delete autoDrafts[draftKey(day,date)];try{localStorage.setItem('il_autosave_v1',JSON.stringify(autoDrafts))}catch{}}
function today(){return new Date().toISOString().split('T')[0]}
function fmtDate(s){if(!s)return '';const[y,m,d]=s.split('-');const mo=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];return d+' '+mo[parseInt(m)-1]+' '+y}
function fmtSecs(s){const m=Math.floor(s/60),sec=s%60;return m+':'+(sec<10?'0':'')+sec}
function parseRange(s){const m=s.match(/×(\d+)[–\-](\d+)/);if(m)return[parseInt(m[1]),parseInt(m[2])];const m2=s.match(/×(\d+)/);if(m2)return[parseInt(m2[1]),parseInt(m2[1])];return[8,12]}

// ─── STATE ──────────────────────────────────────────────
const LEGACY_EXERCISE_NAMES={
  'Incline Dumbbell Press':'Développé incliné haltères',
  'Chest Press':'Chest press',
  'Machine Fly':'Fly machine',
  'Lateral Raises':'Élévations latérales',
  'Triceps Extension':'Extension triceps',
  'Leg Press':'Leg press',
  'Leg Extension':'Leg extension',
  'Leg Curl':'Leg curl',
  'Machine Calf Raise':'Mollets machine',
  'Abs':'Abdos',
  'Neutral-Grip Seated Cable Row':'Tirage horizontal neutre',
  'Neutral-Grip Lat Pulldown':'Tirage vertical neutre',
  'T-Bar Row':'T-barre',
  'Reverse Pec Deck':'Reverse fly machine',
  'Biceps Curl':'Curl biceps',
  'Hammer Curl':'Curl marteau',
  'Dumbbell Bench Press':'Développé couché haltères',
  'Back Squat':'Back squat',
  'Barbell Hip Thrust':'Hip thrust barre',
  'Barbell Romanian Deadlift':'RDL barre',
  'Standing Calf Raise':'Mollets debout',
  'Swiss Ball Crunch':'Abdos swiss ball'
};

document.getElementById('session-date').value=today();
buildState(0);restoreDraft(0,today());renderDayTabs();renderExercises();renderHistFilter();
document.getElementById('session-date').addEventListener('change',()=>{const d=document.getElementById('session-date').value||today();buildState(curDay);if(!restoreDraft(curDay,d)){shoulderPain=0;shoulderNote='';syncShoulderUI();}renderExercises();persistDraft();});
document.getElementById('shoulder-pain').addEventListener('input',e=>{shoulderPain=Number(e.target.value);document.getElementById('shoulder-value').textContent=shoulderPain+'/10';persistDraft();});
document.getElementById('shoulder-note').addEventListener('input',e=>{shoulderNote=e.target.value;persistDraft();});
function syncShoulderUI(){document.getElementById('shoulder-pain').value=shoulderPain;document.getElementById('shoulder-value').textContent=shoulderPain+'/10';document.getElementById('shoulder-note').value=shoulderNote;}

function getLastWorkSetsForDay(exName,day){
  const ordered=[...sessions].filter(s=>s.day===day&&!s.draft).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0));
  for(const session of ordered){
    const oldName=LEGACY_EXERCISE_NAMES[exName];
    const ex=session.exercises.find(e=>e.name===exName||(oldName&&e.name===oldName));
    if(ex&&Array.isArray(ex.sets)&&ex.sets.length)return ex.sets;
  }
  return null;
}
function buildState(day){
  state={};
  DAYS[day].exercises.forEach(ex=>{
    const last=getLastWorkSetsForDay(ex.n,day);
    const num=(last&&last.length)?last.length:(ex.workCount||parseInt(ex.s.split('×')[0])||3);
    const variant=ex.dropdown?'DB':null;
    const defLb=ex.dropdown?TRICEPS_VARIANTS['DB'].defaultLb:ex.defaultLb;
    const work=[];
    for(let i=0;i<num;i++){
      const lb=last&&last[i]?String(last[i].lb):(defLb!=null?String(defLb):'');
      const reps=last&&last[i]?String(last[i].reps):'';
      work.push({lb,reps,done:false});
    }
    const warmup=ex.warmupSets.map(w=>({lb:String(w.lb),reps:String(w.reps)}));
    const lastSession=[...sessions].filter(ss=>ss.day===day&&!ss.draft).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0)).find(ss=>ss.exercises.some(e=>e.name===ex.n||(LEGACY_EXERCISE_NAMES[ex.n]&&e.name===LEGACY_EXERCISE_NAMES[ex.n])));
    const lastEx=lastSession?.exercises?.find(e=>e.name===ex.n||(LEGACY_EXERCISE_NAMES[ex.n]&&e.name===LEGACY_EXERCISE_NAMES[ex.n]));
    if(lastEx&&Array.isArray(lastEx.warmupSets)&&lastEx.warmupSets.length){warmup.splice(0,warmup.length,...lastEx.warmupSets.map(w=>({lb:String(w.lb??''),reps:String(w.reps??'')})));}
    state[ex.n]={warmup,work,comment:lastEx?.comment||'',variant:lastEx?.variant||(ex.dropdown?'DB':null)};
  });
}
function switchVariant(enc,v){
  const n=decodeURIComponent(enc);if(!state[n])return;
  state[n].variant=v;
  const defLb=TRICEPS_VARIANTS[v].defaultLb;
  state[n].work.forEach(s=>s.lb=String(defLb));
  renderExercises();persistDraft();
}

// ─── DAY TABS ───────────────────────────────────────────
function renderDayTabs(){
  const wrap=document.getElementById('day-tabs');wrap.innerHTML='';
  DAYS.forEach((d,i)=>{
    const div=document.createElement('div');
    div.className='day-tab'+(i===curDay?' active':'');
    div.innerHTML=`<span class="icon">${d.icon}</span><div class="dlabel">${d.label}</div><div class="dsub">${d.sub}</div>`;
    div.onclick=()=>{persistDraft();curDay=i;const date=document.getElementById('session-date').value||today();buildState(i);if(!restoreDraft(i,date)){shoulderPain=0;shoulderNote='';syncShoulderUI();}renderDayTabs();renderExercises();persistDraft();};
    wrap.appendChild(div);
  });
}

// ─── RECOMMENDATION ─────────────────────────────────────
function progressionIncrement(name,variant){
  if(name==='Leg Press')return 10;
  if(name==='Incline Dumbbell Press'||name==='Dumbbell Bench Press'||name==='Lateral Raises'||name==='Biceps Curl'||name==='Hammer Curl'||name==='Triceps Extension'&&variant==='DB')return 2.5;
  if(name==='Back Squat'||name==='Barbell Hip Thrust'||name==='Barbell Romanian Deadlift')return 5;
  if(name==='Triceps Extension'&&variant==='Poulie')return 5;
  return 5;
}
function calcReco(ex,workSets){
  const lastSets=getLastWorkSetsForDay(ex.n,curDay);if(!lastSets||!lastSets.length)return null;
  const [rMin,rMax]=parseRange(ex.s);
  const valid=lastSets.filter(s=>Number(s.reps)>0&&Number(s.lb)>=0);if(!valid.length)return null;
  const variant=lastSets.variant||state[ex.n]?.variant;const inc=progressionIncrement(ex.n,variant);
  const allAtTop=valid.length===lastSets.length&&valid.every(s=>Number(s.reps)>=rMax);
  const lowCount=valid.filter(s=>Number(s.reps)<rMin).length;
  const current=Number(valid[0].lb)||0;
  if(allAtTop){const next=current+inc;return{type:'up',label:`🟢 Tous les sets à ${rMax}+ : essayer +${inc} lb`,next};}
  if(lowCount>=Math.ceil(valid.length/2)){const next=Math.max(0,current-inc);return{type:'down',label:`🔴 Plusieurs sets sous ${rMin} reps : réduire de ${inc} lb`,next};}
  return{type:'hold',label:`⚪ Maintenir la charge — viser ${rMax} reps`,next:current};
}
function toggleSetDone(enc,si){
  const n=decodeURIComponent(enc);if(!state[n]||!state[n].work[si])return;
  state[n].work[si].done=!state[n].work[si].done;persistDraft();
  const btn=document.querySelector(`[onclick=\"toggleSetDone('${enc}',${si})\"]`);
  if(btn){btn.classList.toggle('is-done',state[n].work[si].done);btn.setAttribute('aria-pressed',String(state[n].work[si].done));btn.textContent=state[n].work[si].done?'✓ Fait':'Non';}
}
function updateRecoBlock(enc){
  const n=decodeURIComponent(enc);
  const ex=DAYS[curDay].exercises.find(e=>encodeURIComponent(e.n)===enc);
  if(!ex||!state[n])return;
  const reco=calcReco(ex,state[n].work);
  const block=document.getElementById(`reco-${enc}`);
  if(!block)return;
  if(!reco){block.style.display='none';return;}
  block.style.display='flex';
  block.className=`reco-block reco-${reco.type}`;
  block.innerHTML=`<span class="reco-text">${reco.label}</span><span class="reco-next">Prochaine séance : ${reco.next} lb</span>`;
}

// ─── RENDER EXERCISES ────────────────────────────────────
function renderExercises(){
  const wrap=document.getElementById('exercises-list');wrap.innerHTML='';

  DAYS[curDay].exercises.forEach(ex=>{
    const st=state[ex.n];
    const card=document.createElement('div');card.className='ex-card';
    const enc=encodeURIComponent(ex.n);
    let rows='';

    // Warmup
    if(st.warmup.length>0){
      rows+=`<div class="wu-label">Échauffement</div>`;
      rows+=`<div class="serie-header"><span>#</span><span>LB</span><span>REPS</span><span></span><span></span></div>`;
      st.warmup.forEach((s,si)=>{
        rows+=`<div class="serie-row warmup-row">
          <span class="serie-num wu-num">W${si+1}</span>
          <input type="number" inputmode="decimal" placeholder="—" min="0" step="2.5" value="${s.lb}" data-ex="${enc}" data-si="${si}" data-type="warmup" data-field="lb" oninput="setS(this)">
          <input type="number" inputmode="numeric" placeholder="—" min="0" step="1" value="${s.reps}" data-ex="${enc}" data-si="${si}" data-type="warmup" data-field="reps" oninput="setS(this)">
          <span></span>
          <button class="del-btn" onclick="delSet('${enc}','warmup',${si})"><i class="ti ti-x" style="font-size:14px"></i></button>
        </div>`;
      });
    }

    // Work
    const reco=calcReco(ex,st.work);
    rows+=`<div class="work-label">Travail</div>`;
    rows+=`<div class="serie-header"><span>#</span><span>LB</span><span>REPS</span><span></span><span></span></div>`;
    st.work.forEach((s,si)=>{
      rows+=`<div class="serie-row">
        <span class="serie-num">${si+1}</span>
        <input type="number" inputmode="decimal" placeholder="—" min="0" step="2.5" value="${s.lb}" data-ex="${enc}" data-si="${si}" data-type="work" data-field="lb" oninput="setS(this)">
        <input type="number" inputmode="numeric" placeholder="—" min="0" step="1" value="${s.reps}" data-ex="${enc}" data-si="${si}" data-type="work" data-field="reps" oninput="setS(this)">
        <button class="done-btn${s.done?' is-done':''}" aria-pressed="${!!s.done}" onclick="toggleSetDone('${enc}',${si})">${s.done?'✓ Fait':'Non'}</button>
        <button class="del-btn" aria-label="Supprimer la série" onclick="delSet('${enc}','work',${si})"><i class="ti ti-x" style="font-size:14px"></i></button>
      </div>`;
    });

    const recoHtml=`<div id="reco-${enc}" class="reco-block reco-${reco?.type||'hold'}" style="${reco?'':'display:none'}">
      <span class="reco-text">${reco?.label||''}</span>
      <span class="reco-next">${reco?`Prochaine séance : ${reco.next} lb`:''}</span>
    </div>`;

    const dropdownHtml=ex.dropdown?`<div style="padding:0 16px 10px">
      <select style="width:100%;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:10px 12px;font-size:15px;background:var(--surface2);color:var(--text);font-family:inherit;outline:none;" onchange="switchVariant('${enc}',this.value)">
        <option value="DB" ${st.variant==='DB'?'selected':''}>Triceps Extension — Dumbbell (DB)</option>
        <option value="Poulie" ${st.variant==='Poulie'?'selected':''}>Triceps Extension — Cable</option>
      </select></div>`:'';

    card.innerHTML=`<div class="ex-header"><div>
        <div class="ex-name">${ex.n}</div>
        <div class="ex-meta">
          <span class="ex-scheme">${ex.s}</span>
          ${ex.rest?`<span class="ex-rest"><i class="ti ti-clock" style="font-size:11px"></i> ${fmtSecs(ex.rest)}</span>`:''}
          <button class="add-inline" aria-label="Ajouter une série" title="Ajouter une série" onclick="addSet('${enc}','work')">+</button>
        </div></div></div>
      ${dropdownHtml}${rows}${recoHtml}
      <div class="comment-row"><input type="text" placeholder="Commentaire…" value="${st.comment||''}" data-ex="${enc}" oninput="setComment(this)" maxlength="200"></div>
`;
    wrap.appendChild(card);
  });
}

function setS(input){
  const n=decodeURIComponent(input.dataset.ex);
  if(state[n]&&state[n][input.dataset.type]?.[parseInt(input.dataset.si)]){state[n][input.dataset.type][parseInt(input.dataset.si)][input.dataset.field]=input.value;if(input.dataset.type==='work'){const ex=DAYS[curDay].exercises.find(e=>e.n===n);if(ex)updateRecoBlock(encodeURIComponent(n));}persistDraft();}
}
function setComment(input){const n=decodeURIComponent(input.dataset.ex);if(state[n]){state[n].comment=input.value;persistDraft();}}
function addSet(enc,type='work'){
  const n=decodeURIComponent(enc);if(!state[n])return;
  const arr=state[n].work;const last=arr[arr.length-1];
  arr.push({lb:last?last.lb:'',reps:'',done:false});
  renderExercises();persistDraft();
}
function delSet(enc,type,si){
  const n=decodeURIComponent(enc);if(!state[n])return;
  state[n][type].splice(si,1);renderExercises();persistDraft();
}

// ─── SAVE SESSION ────────────────────────────────────────
function saveSession(){
  const date=document.getElementById('session-date').value;
  const exercises=DAYS[curDay].exercises.map(ex=>{
    const st=state[ex.n];
    const sets=st.work.filter(s=>s.lb!==''||s.reps!=='').map(s=>({lb:parseFloat(s.lb)||0,reps:parseInt(s.reps)||0,done:!!s.done}));
    const warmupSets=st.warmup.filter(s=>s.lb!==''||s.reps!=='').map(s=>({lb:parseFloat(s.lb)||0,reps:parseInt(s.reps)||0,warmup:true}));
    return{name:ex.n,sets,warmupSets,comment:st.comment||'',variant:st.variant||null};
  }).filter(e=>e.sets.length>0||e.warmupSets.length>0);
  if(!exercises.length){showToast('Aucune donnée saisie','warn');return;}
  // Replace draft if exists for same day+date, otherwise push
  const draftIdx=sessions.findIndex(s=>s.date===date&&s.day===curDay&&s.draft);
  if(draftIdx>=0){
    sessions[draftIdx]={date,day:curDay,dayLabel:DAYS[curDay].label+' – '+DAYS[curDay].sub,ts:Date.now(),exercises,shoulderPain:Number(shoulderPain)||0,shoulderNote:shoulderNote||''};
  } else {
    sessions.push({date,day:curDay,dayLabel:DAYS[curDay].label+' – '+DAYS[curDay].sub,ts:Date.now(),exercises,shoulderPain:Number(shoulderPain)||0,shoulderNote:shoulderNote||''});
  }
  save();clearDraft(curDay,date);showToast('Séance sauvegardée !');
  buildState(curDay);shoulderPain=0;shoulderNote='';syncShoulderUI();renderExercises();renderHistFilter();persistDraft();renderJournal();
}
// Enregistrer en cours — sauvegarde sans réinitialiser les champs
function recordSession(){
  const date=document.getElementById('session-date').value;
  const exercises=DAYS[curDay].exercises.map(ex=>{
    const st=state[ex.n];
    const sets=st.work.filter(s=>s.lb!==''||s.reps!=='').map(s=>({lb:parseFloat(s.lb)||0,reps:parseInt(s.reps)||0,done:!!s.done}));
    const warmupSets=st.warmup.filter(s=>s.lb!==''||s.reps!=='').map(s=>({lb:parseFloat(s.lb)||0,reps:parseInt(s.reps)||0,warmup:true}));
    return{name:ex.n,sets,warmupSets,comment:st.comment||'',variant:st.variant||null};
  }).filter(e=>e.sets.length>0||e.warmupSets.length>0);
  if(!exercises.length){showToast('Aucune donnée à enregistrer','warn');return;}
  // Find existing draft for same day+date and update it, or create new
  const existing=sessions.findIndex(s=>s.date===date&&s.day===curDay&&s.draft);
  if(existing>=0){
    sessions[existing]={...sessions[existing],exercises,ts:Date.now(),shoulderPain:Number(shoulderPain)||0,shoulderNote:shoulderNote||''};
  } else {
    sessions.push({date,day:curDay,dayLabel:DAYS[curDay].label+' – '+DAYS[curDay].sub,ts:Date.now(),exercises,draft:true,shoulderPain:Number(shoulderPain)||0,shoulderNote:shoulderNote||''});
  }
  save();persistDraft();showToast('Enregistré ✓ — continue ta séance !');
  renderHistFilter();
}

function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=type==='warn'?'var(--red-light)':'var(--green-light)';
  t.style.borderColor=type==='warn'?'var(--red)':'var(--green)';t.style.color=type==='warn'?'var(--red)':'var(--green)';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);
}

// ─── TABS ────────────────────────────────────────────────
function setTab(idx,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  document.getElementById('view-seance').style.display=idx===0?'':'none';
  document.getElementById('view-history').style.display=idx===1?'':'none';
  document.getElementById('view-journal').style.display=idx===2?'':'none';
  if(idx===1){renderHistory();renderHistFilter();}
  if(idx===2){renderJournal();}
}

function escapeHTML(value){return String(value??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}

// ─── HISTORY ─────────────────────────────────────────────
function renderHistFilter(){
  const sel=document.getElementById('hf-ex');const prev=sel.value;
  sel.innerHTML='<option value="">Tous les exercices</option>';
  [...new Set(sessions.flatMap(s=>s.exercises.map(e=>e.name)))].forEach(n=>{
    const o=document.createElement('option');o.value=n;o.textContent=n;if(n===prev)o.selected=true;sel.appendChild(o);
  });
}
function renderHistory(){
  const dayF=document.getElementById('hf-day').value;
  const exF=document.getElementById('hf-ex').value;
  let rows=[...sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  if(dayF!=='')rows=rows.filter(r=>r.day==dayF);
  if(exF!=='')rows=rows.filter(r=>r.exercises.some(e=>e.name===exF));
  const wrap=document.getElementById('hist-content');
  if(!rows.length){wrap.innerHTML='<div class="empty"><i class="ti ti-clipboard-list"></i>Aucune séance enregistrée</div>';return;}
  wrap.innerHTML=rows.map(sess=>{
    const oi=sessions.indexOf(sess);
    const exList=exF?sess.exercises.filter(e=>e.name===exF):sess.exercises;
    const totalSets=exList.reduce((a,e)=>a+(e.sets||[]).length,0);
    const exHtml=exList.map(ex=>{
      const wuLines=(ex.warmupSets||[]).map((s,i)=>`<div class="hist-set-line">
        <span class="hist-set-num">W${i+1}</span><span class="hist-lb">${s.lb} lb</span><span>× ${s.reps} reps</span>
        <span class="hist-wu-tag">échauff.</span></div>`).join('');
      const workLines=(ex.sets||[]).map((s,i)=>`<div class="hist-set-line">
        <span class="hist-set-num">${i+1}</span><span class="hist-lb">${s.lb} lb</span><span>× ${s.reps} reps</span>
        ${s.done?'<span class="hist-wu-tag">Fait</span>':'<span class="hist-wu-tag">Non</span>'}</div>`).join('');
      return `<div class="hist-ex">
        <div class="hist-ex-name">${ex.name}
          <button class="hist-ex-chart-btn" onclick="openChart('${encodeURIComponent(ex.name)}')"><i class="ti ti-chart-line" style="font-size:13px"></i> Progression</button>
        </div>
        ${wuLines}${workLines}
        ${ex.comment?`<div class="hist-comment">"${ex.comment}"</div>`:''}
      </div>`;
    }).join('');
    return `<div class="hist-session">
      <div class="hist-session-hd">
        <span class="hist-date">${fmtDate(sess.date)}</span>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="hist-day-label">${sess.dayLabel||''}</span>
          <button class="hist-del" onclick="deleteSession(${oi})"><i class="ti ti-trash"></i></button>
        </div>
      </div>
      <div class="hist-summary"><span class="hist-stat"><strong>${totalSets}</strong> séries</span><span class="hist-stat"><strong>${exList.length}</strong> exercices</span></div>
      ${sess.shoulderPain!==undefined?`<div class="hist-summary"><span class="hist-stat"><strong>Épaule ${sess.shoulderPain}/10</strong></span>${sess.shoulderNote?`<span class="hist-stat">${escapeHTML(sess.shoulderNote)}</span>`:''}</div>`:''}
      ${exHtml}
    </div>`;
  }).join('');
}
function deleteSession(idx){
  if(!confirm('Supprimer cette séance ?'))return;
  sessions.splice(idx,1);save();renderHistory();renderHistFilter();renderJournal();
}

// ─── CHART ───────────────────────────────────────────────
function openChart(enc){
  const name=decodeURIComponent(enc);
  const data=[];
  sessions.sort((a,b)=>a.date.localeCompare(b.date)).forEach(sess=>{
    const ex=sess.exercises.find(e=>e.name===name);
    if(ex&&ex.sets&&ex.sets.length){
      const maxLb=Math.max(...ex.sets.map(s=>s.lb||0));
      data.push({date:fmtDate(sess.date),lb:maxLb});
    }
  });
  document.getElementById('chart-title').textContent=name;
  document.getElementById('chart-overlay').classList.add('open');
  setTimeout(()=>{
    if(chartInstance){chartInstance.destroy();chartInstance=null;}
    const ctx=document.getElementById('chart-canvas');
    if(!ctx||!data.length){document.getElementById('chart-stats').innerHTML='<p style="color:var(--text3);font-size:13px;text-align:center">Pas encore de données</p>';return;}
    const max=Math.max(...data.map(d=>d.lb));
    const min=Math.min(...data.map(d=>d.lb));
    const last=data[data.length-1].lb;
    const first=data[0].lb;
    const diff=last-first;
    document.getElementById('chart-stats').innerHTML=`
      <div class="chart-stat"><div class="chart-stat-val">${last} lb</div><div class="chart-stat-label">Actuel</div></div>
      <div class="chart-stat"><div class="chart-stat-val">${max} lb</div><div class="chart-stat-label">Max</div></div>
      <div class="chart-stat"><div class="chart-stat-val" style="color:${diff>=0?'var(--green)':'var(--red)'}">${diff>=0?'+':''}${diff} lb</div><div class="chart-stat-label">Progression</div></div>`;
    chartInstance=new Chart(ctx,{
      type:'line',
      data:{labels:data.map(d=>d.date),datasets:[{data:data.map(d=>d.lb),borderColor:'#185FA5',backgroundColor:'rgba(24,95,165,0.08)',borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#185FA5',tension:.3,fill:true}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.raw} lb`}}},scales:{x:{ticks:{font:{size:11}},grid:{display:false}},y:{ticks:{font:{size:11},callback:v=>v+' lb'},grid:{color:'rgba(128,128,128,0.1)'}}}}
    });
  },100);
}
function closeChart(){document.getElementById('chart-overlay').classList.remove('open');}
function closeChartOutside(e){if(e.target===document.getElementById('chart-overlay'))closeChart();}

// ─── JOURNAL ─────────────────────────────────────────────
function renderStatsPanel(){
  const el=document.getElementById('stats-panel');if(!el)return;
  const completed=sessions.filter(s=>!s.draft);const now=new Date();const cutoff=new Date(now);cutoff.setDate(cutoff.getDate()-6);
  const week=completed.filter(s=>{const d=new Date((s.date||'')+'T12:00:00');return !isNaN(d)&&d>=cutoff&&d<=new Date(now.getTime()+86400000)});
  const sets=completed.reduce((n,s)=>n+s.exercises.reduce((m,e)=>m+(e.sets||[]).length,0),0);
  const volume=completed.reduce((n,s)=>n+s.exercises.reduce((m,e)=>m+(e.sets||[]).reduce((k,x)=>k+(Number(x.lb)||0)*(Number(x.reps)||0),0),0),0);
  const shoulder=completed.filter(s=>s.shoulderPain!==undefined).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0)).slice(0,10);
  const avg=shoulder.length?shoulder.reduce((n,s)=>n+Number(s.shoulderPain||0),0)/shoulder.length:null;
  const latest=shoulder[0];
  el.innerHTML=`<div class="stats-tile"><div class="stats-value">${completed.length}</div><div class="stats-label">Séances enregistrées</div></div>
    <div class="stats-tile"><div class="stats-value">${week.length}</div><div class="stats-label">Séances sur 7 jours</div></div>
    <div class="stats-tile"><div class="stats-value">${sets}</div><div class="stats-label">Séries consignées</div></div>
    <div class="stats-tile"><div class="stats-value">${Math.round(volume).toLocaleString('fr-CA')} <small>lb·reps</small></div><div class="stats-label">Volume cumulé indicatif</div></div>
    <div class="stats-note"><strong>Suivi de l’épaule :</strong> ${latest?`dernière mesure ${latest.shoulderPain}/10 (${fmtDate(latest.date)}); moyenne des ${shoulder.length} dernières séances avec mesure : ${avg.toFixed(1)}/10.`:'aucune mesure enregistrée pour le moment.'} ${latest?.shoulderNote?`Dernière note : « ${escapeHTML(latest.shoulderNote)} »`:''} Le volume utilise les charges saisies en lb × répétitions; il sert à comparer tes séances, pas à mesurer un travail mécanique exact.</div>`;
}

function renderJournal(){
  const MONTH_FR=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  renderStatsPanel();
  const DAY_FR=['Lu','Ma','Me','Je','Ve','Sa','Di'];
  document.getElementById('cal-month-label').textContent=MONTH_FR[calMonth]+' '+calYear;

  // Build session date map
  const dateMap={};
  sessions.forEach(s=>{dateMap[s.date]=(dateMap[s.date]||[]).concat(s);});

  // Calendar grid
  const firstDay=new Date(calYear,calMonth,1);
  const lastDay=new Date(calYear,calMonth+1,0);
  let startDow=firstDay.getDay();startDow=(startDow+6)%7; // Mon=0
  const todayStr=today();
  let grid=`${DAY_FR.map(d=>`<div class="cal-day-name">${d}</div>`).join('')}`;
  // Empty cells before
  for(let i=0;i<startDow;i++) grid+=`<div class="cal-cell other-month"></div>`;
  for(let d=1;d<=lastDay.getDate();d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasSess=!!dateMap[dateStr];
    const isToday=dateStr===todayStr;
    grid+=`<div class="cal-cell${hasSess?' has-session':''}${isToday?' today':''}" ${hasSess?`onclick="scrollToDate('${dateStr}')"`:''}>${d}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=grid;

  // Sessions list for this month
  const monthSessions=sessions
    .filter(s=>s.date.startsWith(`${calYear}-${String(calMonth+1).padStart(2,'0')}`))
    .sort((a,b)=>b.date.localeCompare(a.date));

  const allSessions=sessions.sort((a,b)=>b.date.localeCompare(a.date));

  document.getElementById('journal-sessions').innerHTML=allSessions.map(sess=>{
    const oi=sessions.indexOf(sess);
    const totalSets=sess.exercises.reduce((a,e)=>a+(e.sets||[]).length,0);
    const totalReps=sess.exercises.reduce((a,e)=>a+(e.sets||[]).reduce((b,s)=>b+(s.reps||0),0),0);
    return `<div class="session-card" id="sess-${sess.date}-${sess.ts}">
      <div class="session-card-hd">
        <span class="session-card-date">${fmtDate(sess.date)}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="session-card-day">${sess.dayLabel||''}</span>
          <button class="session-card-del" onclick="deleteSession(${oi})"><i class="ti ti-trash" style="font-size:17px;color:var(--text3)"></i></button>
        </div>
      </div>
      <div class="session-card-stats">
        <span class="hist-stat"><strong>${sess.exercises.length}</strong> exercices</span>
        <span class="hist-stat"><strong>${totalSets}</strong> séries</span>
        <span class="hist-stat"><strong>${totalReps}</strong> reps totales</span>
      </div>
    </div>`;
  }).join('')||'<div class="empty"><i class="ti ti-calendar-off" style="font-size:32px;display:block;margin-bottom:8px"></i>Aucune séance ce mois</div>';
}
function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderJournal();}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderJournal();}
function scrollToDate(date){
  const els=document.querySelectorAll(`[id^="sess-${date}"]`);
  if(els.length)els[0].scrollIntoView({behavior:'smooth',block:'start'});
}

// ─── DATA I/O ────────────────────────────────────────────
function openSheet(){document.getElementById('overlay').classList.add('open');}
function closeSheet(){document.getElementById('overlay').classList.remove('open');}
function closeSheetOutside(e){if(e.target===document.getElementById('overlay'))closeSheet();}
function exportJSON(){
  const blob=new Blob([JSON.stringify(sessions,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ironlog-backup.json';a.click();URL.revokeObjectURL(url);closeSheet();
}
function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const imported=JSON.parse(ev.target.result);if(!Array.isArray(imported))throw new Error();
      if(!confirm(`Importer ${imported.length} séance(s) ?`))return;
      const existing=new Set(sessions.map(s=>s.ts));
      const newOnes=imported.filter(s=>!existing.has(s.ts));
      sessions=[...sessions,...newOnes].sort((a,b)=>a.date.localeCompare(b.date));
      save();renderHistory();renderHistFilter();renderJournal();closeSheet();showToast(`${newOnes.length} séance(s) importée(s) !`);
    }catch{showToast('Fichier invalide','warn');}
  };
  reader.readAsText(file);e.target.value='';
}
function exportCSV(){
  if(!sessions.length){showToast('Aucune donnée','warn');return;}
  let csv='Date,Day,Exercise,Type,Set,LB,Reps,Done,Comment,ShoulderPain,ShoulderNote\n';
  sessions.forEach(s=>s.exercises.forEach(ex=>{
    (ex.warmupSets||[]).forEach((set,i)=>csv+=`${s.date},"${s.dayLabel||''}","${ex.name}",Échauffement,W${i+1},${set.lb},${set.reps},,\n`);
    (ex.sets||[]).forEach((set,i)=>csv+=`${s.date},"${s.dayLabel||''}","${ex.name}",Work,${i+1},${set.lb},${set.reps},${set.done?'Yes':'No'},"${ex.comment||''}",${s.shoulderPain??''},"${(s.shoulderNote||'').replaceAll('\"','\"\"')}"\n`);
  }));
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ironlog.csv';a.click();URL.revokeObjectURL(url);closeSheet();
}
</script>
